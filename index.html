.card p{font-size:11px;color:#888;margin-top:4px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:999;justify-content:center;align-items:center;padding:15px}
.modal-box{background:#1c1c1c;width:100%;max-width:600px;border-radius:12px;overflow:hidden}
.modal-box iframe{width:100%;height:320px;border:none;background:#000}
.modal-body{padding:15px}
.close{float:right;font-size:26px;cursor:pointer}
.btn{background:#e50914;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;margin-top:12px;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:30px;color:#555;font-size:12px;line-height:1.6}
</style>
